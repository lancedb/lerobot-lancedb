[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot-lancedb"
version = "0.3.1"
description = "Companion tooling for lerobot's native Lance support: dataset converter (LeRobot v3.0 -> Lance layout), dataset doctor, and the LanceDBDataset training loader."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Ayush Chaurasia", email = "ayush@lancedb.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["lerobot", "lancedb", "lance", "robotics", "datasets", "converter"]

dependencies = [
    # Floor set by the converter/doctor/reader imports (lerobot.datasets.language,
    # dataset_metadata, depth_utils, feature_utils, video_utils, configs.video,
    # all in 0.6.0 on PyPI). The [dataset] extra supplies datasets, av and
    # torchcodec, which lerobot.datasets imports; base lerobot alone fails at
    # import time. lerobot also supplies the reader's heavy deps (torch,
    # numpy, huggingface_hub), so they're pinned there, not here, to avoid
    # version conflicts.
    "lerobot[dataset]>=0.6.0",
    # External Blob v2 initial_bases + commit-pinned hf:// + 429 Retry-After +
    # fetch_blob_ranges; betas are published on fury, not PyPI — see the README
    # install note.
    "lancedb>=0.42.0b26",
    "pyarrow>=17.0.0",
    # pyav: byte-index construction (converter) and container inspection
    # (doctor). Declared directly because both import it themselves.
    "av>=12.0.0",
]

[project.optional-dependencies]
s3 = [
    "boto3>=1.28.0",
]
gcs = [
    "gcsfs>=2024.2.0",
]
cloud = [
    "boto3>=1.28.0",
    "gcsfs>=2024.2.0",
]
dev = [
    "boto3>=1.28.0",
    "pytest>=8.0",
    "ruff>=0.14.1",
    "build>=1.2",
    "twine>=5.1",
]

[project.scripts]
lerobot-lance-convert = "lerobot_lancedb.convert:main"
lerobot-lance-doctor = "lerobot_lancedb.doctor:main"

[project.urls]
homepage = "https://github.com/lancedb/lerobot-lancedb"
issues = "https://github.com/lancedb/lerobot-lancedb/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "PLC0415"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# convert.py / doctor.py import heavy optional pieces (av, LeRobotDataset)
# at call time on purpose, so CLI --help stays fast.
"src/lerobot_lancedb/convert.py" = ["PLC0415"]
"src/lerobot_lancedb/doctor.py" = ["PLC0415"]
"src/lerobot_lancedb/_source.py" = ["PLC0415"]
