[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot-lancedb"
version = "0.3.1"
description = "Companion tooling for lerobot's native Lance support: dataset converter (LeRobot v3.0 -> Lance layout), dataset doctor, and the LanceDBDataset training loader."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Ayush Chaurasia", email = "ayush@lancedb.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["lerobot", "lancedb", "lance", "robotics", "datasets", "converter"]

dependencies = [
    # Floor set by the converter/doctor/reader imports (lerobot.datasets.language,
    # dataset_metadata, depth_utils, feature_utils, video_utils, configs.video,
    # all in 0.6.0 on PyPI). lerobot also supplies the reader's heavy deps
    # (torch, torchcodec, numpy, huggingface_hub), so they're pinned there, not
    # here, to avoid version conflicts.
    "lerobot>=0.6.0",
    # fetch_blob_ranges + blob v2 columns; betas are published on fury, not
    # PyPI — see the README install note.
    "lancedb>=0.37.1b0",
    "pyarrow>=17.0.0",
    # pyav: byte-index construction (converter) and container inspection
    # (doctor). Listed explicitly because lerobot moved it behind the
    # [dataset] extra in 0.6.
    "av>=12.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.14.1",
    "build>=1.2",
    "twine>=5.1",
]

[project.scripts]
lerobot-lance-convert = "lerobot_lancedb.convert:main"
lerobot-lance-doctor = "lerobot_lancedb.doctor:main"

[project.urls]
homepage = "https://github.com/lancedb/lerobot-lancedb"
issues = "https://github.com/lancedb/lerobot-lancedb/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 110
# reader.py is a verbatim vendored copy of lerobot's loader (deleted once the
# loader lands upstream); don't lint it so it stays diff-able against upstream.
extend-exclude = ["src/lerobot_lancedb/reader.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "PLC0415"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# convert.py / doctor.py import heavy optional pieces (av, LeRobotDataset)
# at call time on purpose, so CLI --help stays fast.
"src/lerobot_lancedb/convert.py" = ["PLC0415"]
"src/lerobot_lancedb/doctor.py" = ["PLC0415"]
